name: RDP via VPS

on:
  workflow_dispatch:
    inputs:
      windows_version:
        description: 'Windows Version'
        required: true
        default: 'windows-latest'
        type: choice
        options:
          - windows-latest
          - windows-2025
          - windows-2022

      username:
        description: 'RDP Username (3-20 karakter)'
        required: true
        default: 'admin'

      password:
        description: 'RDP Password (min 8 char, kompleks)'
        required: true
        default: 'Rdp#2025x'

      vps_host:
        description: 'VPS Hostname / IP'
        required: true

      vps_user:
        description: 'VPS SSH Username'
        required: true

      vps_ssh_port:
        description: 'VPS SSH Port'
        required: true
        default: '22'

      remote_port:
        description: 'Port publik di VPS untuk RDP (harus terbuka)'
        required: true
        default: '13389'

jobs:
  build:
    runs-on: ${{ github.event.inputs.windows_version }}
    timeout-minutes: 350

    steps:
      - name: Validate inputs
        shell: pwsh
        run: |
          $user = "${{ github.event.inputs.username }}"
          $pass = "${{ github.event.inputs.password }}"

          if ($user -notmatch '^[a-zA-Z0-9._-]{3,20}$') {
            Write-Error "Username tidak valid. Hanya huruf, angka, titik, underscore, strip. 3-20 karakter."
            exit 1
          }
          if ($pass.Length -lt 8) {
            Write-Error "Password minimal 8 karakter."
            exit 1
          }
          $hasUpper  = $pass -cmatch '[A-Z]'
          $hasLower  = $pass -cmatch '[a-z]'
          $hasDigit  = $pass -match '[0-9]'
          $hasSymbol = $pass -match '[^a-zA-Z0-9]'
          $categories = @($hasUpper, $hasLower, $hasDigit, $hasSymbol) | Where-Object { $_ }
          if ($categories.Count -lt 3) {
            Write-Error "Password harus punya minimal 3 dari: huruf besar, huruf kecil, angka, simbol."
            exit 1
          }
          if ($pass -match [regex]::Escape($user)) {
            Write-Error "Password tidak boleh mengandung username."
            exit 1
          }
          Write-Host "Input valid. user=$user pass_len=$($pass.Length)"

      - name: Enable RDP
        shell: pwsh
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1
          Write-Host "RDP enabled on port 3389"

      - name: Rename user
        shell: pwsh
        run: |
          $newUser = "${{ github.event.inputs.username }}"
          if ($newUser -ne "runneradmin") {
            if (Get-LocalUser -Name $newUser -ErrorAction SilentlyContinue) {
              Write-Host "User $newUser already exists"
            } else {
              Rename-LocalUser -Name "runneradmin" -NewName $newUser
              Write-Host "Renamed runneradmin -> $newUser"
            }
          } else {
            Write-Host "Keeping default runneradmin"
          }

      - name: Set password
        shell: pwsh
        run: |
          $user = "${{ github.event.inputs.username }}"
          $pass = ConvertTo-SecureString -AsPlainText "${{ github.event.inputs.password }}" -Force
          Set-LocalUser -Name $user -Password $pass
          Set-LocalUser -Name $user -PasswordNeverExpires $true
          Add-LocalGroupMember -Group "Administrators" -Member $user -ErrorAction SilentlyContinue
          Write-Host "Password set"

      - name: Setup SSH key
        shell: pwsh
        run: |
          $key = "${{ secrets.VPS_SSH_KEY }}"
          if (-not $key) {
            Write-Error "Secret VPS_SSH_KEY tidak ditemukan"
            exit 1
          }
          $sshDir = "$env:USERPROFILE\.ssh"
          New-Item -ItemType Directory -Path $sshDir -Force | Out-Null
          $keyPath = "$sshDir\vps_key"
          $key | Out-File -FilePath $keyPath -Encoding ascii -NoNewline
          icacls $keyPath /inheritance:r /grant:r "$($env:USERNAME):(R)" | Out-Null
          Write-Host "SSH key written to $keyPath"

      - name: Start reverse SSH tunnel
        shell: pwsh
        run: |
          $sshArgs = @(
            "-N",
            "-R", "${{ github.event.inputs.remote_port }}:localhost:3389",
            "-p", "${{ github.event.inputs.vps_ssh_port }}",
            "-i", "$env:USERPROFILE\.ssh\vps_key",
            "-o", "StrictHostKeyChecking=no",
            "-o", "UserKnownHostsFile=NUL",
            "-o", "ServerAliveInterval=30",
            "-o", "ServerAliveCountMax=3",
            "-o", "ExitOnForwardFailure=yes",
            "${{ github.event.inputs.vps_user }}@${{ github.event.inputs.vps_host }}"
          )

          # Cek ssh tersedia
          if (-not (Get-Command ssh -ErrorAction SilentlyContinue)) {
            Write-Error "SSH client tidak ditemukan di runner"
            exit 1
          }

          Write-Host "Starting reverse tunnel..."
          $proc = Start-Process -FilePath "ssh" -ArgumentList $sshArgs -PassThru -NoNewWindow

          # Tunggu 10 detik, cek masih hidup
          Start-Sleep -Seconds 10
          if ($proc.HasExited) {
            Write-Error "SSH tunnel gagal start (exit code: $($proc.ExitCode))"
            exit 1
          }
          Write-Host "SSH tunnel aktif (PID: $($proc.Id))"
          $proc.Id | Out-File -FilePath "$env:TEMP\ssh.pid" -Encoding ascii

      - name: Print connection info
        shell: pwsh
        run: |
          Write-Host "========================================"
          Write-Host "      RDP CONNECTION DETAILS"
          Write-Host "========================================"
          Write-Host "  Host     : ${{ github.event.inputs.vps_host }}:${{ github.event.inputs.remote_port }}"
          Write-Host "  Username : ${{ github.event.inputs.username }}"
          Write-Host "  Password : ${{ github.event.inputs.password }}"
          Write-Host "----------------------------------------"
          Write-Host "  Windows  : ${{ github.event.inputs.windows_version }}"
          Write-Host "  Expires  : 5 hours 50 minutes from now"
          Write-Host "  Route    : Windows App -> VPS -> Runner"
          Write-Host "========================================"
          Write-Host ""
          Write-Host "Langkah connect:"
          Write-Host "  1. Buka Windows App / mstsc"
          Write-Host "  2. PC name: ${{ github.event.inputs.vps_host }}:${{ github.event.inputs.remote_port }}"
          Write-Host "  3. Username & password di atas"
          Write-Host "========================================"

      - name: Monitor tunnel
        shell: pwsh
        run: |
          Write-Host "Memantau tunnel selama ~5h 50m..."
          $pidFile = "$env:TEMP\ssh.pid"
          for ($i = 0; $i -lt 350; $i++) {
            Start-Sleep -Seconds 60
            if (-not (Test-Path $pidFile)) { break }
            $tunnelPid = Get-Content $pidFile
            $proc = Get-Process -Id $tunnelPid -ErrorAction SilentlyContinue
            if (-not $proc) {
              Write-Error "SSH tunnel mati pada menit ke-$i. Runner akan berhenti."
              exit 1
            }
            if ($i % 10 -eq 0) {
              Write-Host "[$i min] Tunnel masih aktif (PID: $tunnelPid)"
            }
          }
