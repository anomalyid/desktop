name: RDP-Tailscale

on:
  workflow_dispatch:
    inputs:
      tailscale_authkey:
        description: 'Tailscale Auth Key (dari admin console)'
        required: true
      password:
        description: 'Password RDP (min 8 char, kompleks)'
        required: true
        default: 'Rdp#2025x'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 350
    steps:
      - name: Enable RDP & Set Password
        shell: pwsh
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-LocalUser -Name "runneradmin" -Password (ConvertTo-SecureString "${{ github.event.inputs.password }}" -AsPlainText -Force)
          Add-LocalGroupMember -Group "Administrators" -Member "runneradmin"

      - name: Install Tailscale
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" -OutFile "tailscale-setup.exe"
          Start-Process -FilePath ".\tailscale-setup.exe" -ArgumentList "/quiet" -Wait
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey ${{ github.event.inputs.tailscale_authkey }} --hostname "gh-rdp-runner" --accept-routes

      - name: Show Tailscale IP
        shell: pwsh
        run: |
          $ip = & "C:\Program Files\Tailscale\tailscale.exe" ip -4
          Write-Host "========================================"
          Write-Host "RDP Host (Tailscale IP): $ip"
          Write-Host "Username: runneradmin"
          Write-Host "Password: ${{ github.event.inputs.password }}"
          Write-Host "========================================"
          Write-Host "Connect via Windows App to $ip"

      - name: Keep Alive
        shell: pwsh
        run: Start-Sleep -Seconds 19800
